name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hospital-bulk-processor:ci .
      - name: Run and probe /health
        run: |
          docker run -d --name app -p 8000:8000 -e UPSTREAM_WARM_ON_STARTUP=false hospital-bulk-processor:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1
