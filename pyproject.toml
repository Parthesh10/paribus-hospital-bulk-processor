[project]
name = "hospital-bulk-processor"
version = "1.0.0"
description = "CSV bulk import service for the Hospital Directory API (Paribus take-home)."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are pinned (with transitive deps) in requirements.txt.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "C4",       # comprehensions
    "LOG", "G", # logging
]
ignore = [
    "RUF012",   # mutable class attrs are fine for pydantic/test fixtures
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: hits the real upstream API (opt in with `-m integration`)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
