<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital Bulk Processor</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --border: #dde2e8;
    --accent: #1f6feb; --accent-text: #ffffff; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
    --info: #0969da; --chip: #eef1f5; --bar: #e6e9ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e; --border: #30363d;
      --accent: #2f81f7; --ok: #3fb950; --warn: #d29922; --err: #f85149; --info: #58a6ff;
      --chip: #21262d; --bar: #21262d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
           flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  a { color: var(--info); }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: 18px; margin-bottom: 16px; }
  .drop { display: block; border: 2px dashed var(--border); border-radius: 10px; padding: 22px;
          text-align: center; cursor: pointer; transition: border-color .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); }
  .drop input { display: none; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  button { font: inherit; border: 1px solid var(--border); background: var(--chip); color: var(--text);
           border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--err); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px;
           font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
  .s-ok { color: var(--ok); } .s-warn { color: var(--warn); } .s-err { color: var(--err); }
  .s-info { color: var(--info); } .s-muted { color: var(--muted); }
  ul.issues { margin: 0; padding-left: 18px; }
  ul.issues li { margin: 2px 0; }
  .bar { height: 10px; background: var(--bar); border-radius: 999px; overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; transition: width .25s; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.err { color: var(--err); font-size: 13px; }
  #preview td:nth-child(4), #rows td:nth-child(3) { white-space: nowrap; }
  td { overflow-wrap: anywhere; }
  code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
  .hidden { display: none; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin-bottom: 12px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text);
           color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Hospital Bulk Processor</h1>
      <div class="muted">Upload a CSV (<code>name,address,phone</code>, up to 20 rows) to create and
        activate hospitals in the Hospital Directory.</div>
    </div>
    <nav><a href="/docs">API docs</a> · <a href="/health">health</a></nav>
  </header>

  <section class="panel">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".csv,text/csv">
      <strong id="file-label">Choose a CSV file</strong>
      <div class="muted">or drop it here</div>
    </label>
    <div class="row">
      <button id="validate" disabled>Validate</button>
      <button id="process" class="primary" disabled>Process</button>
      <label class="check"><input type="checkbox" id="skip-invalid"> Skip invalid rows</label>
    </div>
  </section>

  <section class="panel hidden" id="validation">
    <h2>Validation</h2>
    <div class="chips" id="validation-chips"></div>
    <div id="validation-issues"></div>
    <div class="table-wrap"><table id="preview"></table></div>
  </section>

  <section class="panel hidden" id="batch">
    <h2>Batch <code id="batch-id"></code> <span id="batch-status"></span></h2>
    <dl class="kv">
      <dt>Progress</dt><dd id="batch-counts"></dd>
      <dt>Processing time</dt><dd id="batch-time"></dd>
      <dt>Activated</dt><dd id="batch-activated"></dd>
      <dt>Updates</dt><dd id="batch-channel" class="muted"></dd>
    </dl>
    <div class="bar" id="bar"><span class="s-ok" style="background:var(--ok)"></span><span style="background:var(--err)"></span><span style="background:var(--muted)"></span></div>
    <div class="row">
      <button id="resume" class="hidden">Resume failed rows</button>
      <button id="rollback" class="danger hidden">Roll back batch</button>
    </div>
    <div class="table-wrap" style="margin-top:14px"><table id="rows"></table></div>
  </section>
</main>
<div id="toast" class="hidden"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const STATUS_CLASS = {
  created_and_activated: "s-ok", completed: "s-ok", created: "s-info", processing: "s-info",
  in_progress: "s-info", queued: "s-muted", pending: "s-muted", rolling_back: "s-warn",
  partial_failure: "s-err", activation_failed: "s-err", failed: "s-err",
  skipped_invalid: "s-warn", rolled_back: "s-muted",
};
const TERMINAL = new Set(["completed", "partial_failure", "activation_failed", "rolled_back"]);
let file = null, result = null, socket = null, pollTimer = null;

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);  // never innerHTML with data
  if (cls) node.className = cls;
  return node;
}
function badge(status) { return el("span", status.replaceAll("_", " "), "badge " + (STATUS_CLASS[status] || "s-muted")); }
function toast(message) {
  const t = $("toast"); t.textContent = message; t.classList.remove("hidden");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.add("hidden"), 4000);
}
function setTable(table, headers, rows) {
  table.replaceChildren();
  const head = el("tr"); headers.forEach((h) => head.append(el("th", h)));
  table.append(head);
  rows.forEach((cells) => {
    const tr = el("tr");
    cells.forEach((c) => { const td = el("td"); if (c instanceof Node) td.append(c); else td.textContent = c ?? ""; tr.append(td); });
    table.append(tr);
  });
}

// ---- file selection -------------------------------------------------------------------------
function pickFile(f) {
  file = f || null;
  $("file-label").textContent = file ? `${file.name} (${file.size.toLocaleString()} bytes)` : "Choose a CSV file";
  $("validate").disabled = $("process").disabled = !file;
}
$("file").addEventListener("change", (e) => pickFile(e.target.files[0]));
const drop = $("drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => pickFile(e.dataTransfer.files[0]));

function formData() { const fd = new FormData(); fd.append("file", file); return fd; }

// ---- validation -----------------------------------------------------------------------------
function renderValidation(report) {
  $("validation").classList.remove("hidden");
  const chips = $("validation-chips"); chips.replaceChildren(
    el("span", report.valid ? "valid" : "invalid", "badge " + (report.valid ? "s-ok" : "s-err")),
    el("span", `${report.total_rows} rows`, "chip"), el("span", `${report.valid_rows} valid`, "chip"),
    el("span", `${report.invalid_rows} invalid`, "chip"), el("span", `${report.warnings.length} warnings`, "chip"));
  const issues = $("validation-issues"); issues.replaceChildren();
  const list = el("ul", null, "issues");
  const where = (i) => i.row ? `Row ${i.row} (line ${i.line}): ` : (i.line ? `Line ${i.line}: ` : "");
  report.errors.forEach((i) => list.append(el("li", where(i) + i.message, "s-err")));
  report.warnings.forEach((i) => list.append(el("li", where(i) + i.message, "s-warn")));
  if (list.children.length) issues.append(list);
  setTable($("preview"), ["Row", "Name", "Address", "Phone", ""], report.rows.map((r) =>
    [r.row, r.name, r.address, r.phone, badge(r.valid ? "valid" : "invalid")]));
}
STATUS_CLASS.valid = "s-ok"; STATUS_CLASS.invalid = "s-err";

$("validate").addEventListener("click", async () => {
  const res = await fetch("/hospitals/bulk/validate", { method: "POST", body: formData() });
  renderValidation(await res.json());
});

// ---- processing & live progress -------------------------------------------------------------
$("process").addEventListener("click", async () => {
  const skip = $("skip-invalid").checked ? "&skip_invalid=true" : "";
  $("process").disabled = true;
  try {
    const res = await fetch(`/hospitals/bulk?async=true${skip}`, { method: "POST", body: formData() });
    const body = await res.json();
    if (!res.ok) {
      toast(body.error.message);
      if (body.error.details && body.error.details.rows) renderValidation(body.error.details);
      return;
    }
    $("validation").classList.add("hidden");
    track(body.batch_id, body.links);
  } finally { $("process").disabled = !file; }
});

function counts(r) {
  const c = { total: r.hospitals.length, processed: 0, failed: 0, skipped: 0, pending: 0 };
  r.hospitals.forEach((h) => {
    if (h.status === "created" || h.status === "created_and_activated") c.processed++;
    else if (h.status === "failed") c.failed++;
    else if (h.status === "skipped_invalid") c.skipped++;
    else if (h.status === "pending" || h.status === "in_progress") c.pending++;
  });
  return c;
}

function render() {
  if (!result) return;
  $("batch").classList.remove("hidden");
  $("batch-id").textContent = result.batch_id;
  $("batch-status").replaceChildren(badge(result.status));
  const c = counts(result);
  $("batch-counts").textContent = `${c.processed} created · ${c.failed} failed · ${c.skipped} skipped · ${c.pending} pending (of ${c.total})`;
  $("batch-time").textContent = `${Number(result.processing_time_seconds).toFixed(2)} s`;
  $("batch-activated").replaceChildren(badge(result.batch_activated ? "yes" : "no"));
  const pct = (n) => (c.total ? (100 * n) / c.total : 0) + "%";
  const [ok, bad, skip] = $("bar").children;
  ok.style.width = pct(c.processed); bad.style.width = pct(c.failed); skip.style.width = pct(c.skipped);
  $("resume").classList.toggle("hidden", !result.resumable);
  $("rollback").classList.toggle("hidden", !["partial_failure", "activation_failed", "completed"].includes(result.status));
  setTable($("rows"), ["Row", "Name", "Hospital ID", "Status", "Error"], result.hospitals.map((h) => {
    const err = el("span", h.error || "", "s-err"); err.style.fontSize = "13px";
    return [h.row, h.name, h.hospital_id, badge(h.status), err];
  }));
}
STATUS_CLASS.yes = "s-ok"; STATUS_CLASS.no = "s-muted";

function stopTracking() {
  if (socket) { socket.onclose = null; socket.close(); socket = null; }
  clearTimeout(pollTimer);
}

function track(batchId, links) {
  stopTracking();
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  socket = new WebSocket(`${proto}//${location.host}${links.websocket}`);
  $("batch-channel").textContent = "connecting WebSocket…";
  socket.onopen = () => { $("batch-channel").textContent = "live (WebSocket)"; };
  socket.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    if (ev.type === "snapshot") result = ev.result;
    else if (ev.type === "row" && result) result.hospitals[ev.row.row - 1] = ev.row;
    else if (ev.type === "job" && result) { result.status = ev.status; if (ev.result) result = ev.result; }
    else if (ev.type === "error") toast(ev.message);
    render();
  };
  socket.onclose = () => {
    socket = null;
    if (result && TERMINAL.has(result.status)) { $("batch-channel").textContent = "finished"; return; }
    $("batch-channel").textContent = "polling (WebSocket unavailable)";
    poll(links.status);
  };
}

async function poll(url) {
  try {
    const res = await fetch(url);
    if (res.ok) { result = await res.json(); render(); }
  } catch (e) { /* transient; keep polling */ }
  if (!result || !TERMINAL.has(result.status)) pollTimer = setTimeout(() => poll(url), 1000);
  else $("batch-channel").textContent = "finished";
}

$("resume").addEventListener("click", async () => {
  const res = await fetch(`${result.links.resume}?async=true`, { method: "POST" });
  const body = await res.json();
  if (res.status === 202) track(body.batch_id, body.links);
  else if (res.ok) { result = body; render(); }
  else toast(body.error.message);
});

$("rollback").addEventListener("click", async () => {
  if (!confirm("Delete every hospital in this batch from the directory?")) return;
  const res = await fetch(result.links.rollback, { method: "DELETE" });
  const body = await res.json();
  if (res.ok) { result = body; render(); toast("Batch rolled back"); }
  else toast(body.error.message);
});
</script>
</body>
</html>
